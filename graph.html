<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>body { background-color: #111; margin: 0; padding: 0; }</style>
</head>
<body>
    <div id="chart" style="width:100%; height:100vh;"></div>
    <script>
        // Datos extraídos de tu CSV
        const data = [
            { t: '2026-03-29 22:53:58', o: 123808.84, c: 123811.74 },
            { t: '2026-03-29 22:53:48', o: 123801.29, c: 123805.65 },
            { t: '2026-03-29 22:53:39', o: 123818.80, c: 123814.93 },
            { t: '2026-03-29 21:37:51', o: 123849.52, c: 123847.90 },
            { t: '2026-03-29 21:37:46', o: 123847.97, c: 123848.20 },
            { t: '2026-03-29 21:37:41', o: 123856.26, c: 123848.76 }
        ];

        const trace = {
            x: data.map(d => d.t),
            open: data.map(d => d.o),
            high: data.map(d => Math.max(d.o, d.c)),
            low: data.map(d => Math.min(d.o, d.c)),
            close: data.map(d => d.c),
            type: 'candlestick',
            increasing: {line: {color: '#00ffcc'}},
            decreasing: {line: {color: '#ff00ff'}},
            name: 'Jump 25'
        };

        const layout = {
            title: 'Trading View - Jump 25 Index',
            dragmode: 'zoom',
            showlegend: false,
            template: 'plotly_dark',
            xaxis: { rangeslider: { visible: false } },
            margin: { l: 50, r: 10, t: 50, b: 50 }
        };

        Plotly.newPlot('chart', [trace], layout);
    </script>
</body>
</html>
